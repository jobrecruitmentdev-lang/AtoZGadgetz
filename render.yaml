services:
  # 1. Express + Prisma Backend API
  - type: web
    name: atozgadgetz-backend
    env: node
    rootDir: backend
    plan: free
    # Prisma requires MySQL, so you MUST provide an external MySQL database URL.
    # Render's free tier only provides Postgres. You can use a free MySQL database 
    # from Aiven (aiven.io) or TiDB (tidbcloud.com) and paste the URL in the Render Dashboard.
    envVars:
      - key: DATABASE_URL
        sync: false # You must paste your external MySQL URL in the Render Dashboard
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: SECRET_KEY
        sync: false # Add this in Render Dashboard
      - key: CJ_API_KEY
        sync: false # Add this in Render Dashboard
    buildCommand: npm install && npx prisma generate && npx tsc
    startCommand: npm run start

  # 2. Next.js Frontend
  - type: web
    name: atozgadgetz-frontend
    env: node
    rootDir: frontend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        # This automatically points to your backend service deployed above!
        fromService:
          type: web
          name: atozgadgetz-backend
          envVarKey: RENDER_EXTERNAL_URL
    buildCommand: npm install && npm run build
    startCommand: npm run start
